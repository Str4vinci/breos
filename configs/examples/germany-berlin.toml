# Germany scenario: location, cost preset, and emissions factor swapped together.
# Compare against configs/examples/pv-plus-battery.toml (Portugal) to see how
# prices and grid carbon intensity change the economics and CO2 results. The
# system is also sized up for the higher demand (12 modules, 7.5 kWh).
# The residential_de preset prices energy at one flat rate;
# quarterly-tariff-berlin.toml prices the same system with a time-of-use tariff.
#
#   breos run --config configs/examples/germany-berlin.toml

location = "berlin"
n_modules = 12
annual_consumption_kwh = 4500
battery_kwh = 7.5

load_profile = "demandlib_h0"
cost_preset = "residential_de"
emissions_country = "DE"
projection_years = 20
resolution = "h"
