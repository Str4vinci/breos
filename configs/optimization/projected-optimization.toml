# Projected-lifetime multi-objective sizing.
#
# This is NOT a `breos run` config. The nested sections below are the shape the
# optimization API expects, which differs from the flat App config used by the
# other files in this directory. Load it from Python:
#
#   import tomllib
#   from breos.optimization import optimize_system_multi_objective
#   with open("configs/optimization/projected-optimization.toml", "rb") as fh:
#       config = tomllib.load(fh)
#
# See docs/getting-started/optimization.md for the full walkthrough, including
# how to load the weather and load-profile DataFrames the call also needs.
#
# Requires the pymoo extra:  pip install "breos[optimization]"
#
# There is no n_modules or battery_kwh here on purpose. The optimizer searches
# for them within the [constraints] bounds.
#
# Every table takes a fixed set of keys, and an unknown key raises. A key left
# out takes the default docs/api/optimization.md lists. The weather and load
# are not config keys: the call takes them as DataFrames.

inverter_efficiency = 0.96

[location]
latitude = 41.1579
longitude = -8.6291
timezone = "Europe/Lisbon"
name = "Porto, Portugal"

[pv]
module = "Suntech_STP550S_STC"   # `breos list modules` shows the catalogue
module_width_m = 1.134
module_length_m = 2.278
degradation_rate = 0.005         # fraction per year

[battery]
eol_percentage = 0.70            # replace once usable capacity drops below this
allow_terminal_replacement = true  # false: no pack bought at the horizon's final degradation period
calendar_model = "naumann_lam_field_calibrated"
max_soc = 0.90
min_soc = 0.10
charge_efficiency = 0.975
discharge_efficiency = 0.975
temperature = 25.0
indoor_model = { enabled = false }
enable_replacement = true
replacement_cost = "calculate"

[optimization]
# "projected" scores candidates over the whole horizon using simulated yearly
# values. It is the only basis; "steady_state" was removed in 0.7.0.
objective_basis = "projected"
pop_size = 40
n_offsprings = 20
n_gen = 40
seed = 1                         # fix this; NSGA-II is stochastic
# optimize_system_multi_objective reads the four settings above unless you pass
# them as arguments; an argument that disagrees with its key raises.

[optimization.early_stop]
ftol = 0.0025
period = 10
min_gen = 20
n_skip = 0

[constraints]
budget = 15000.0
max_area_m2 = 25.0
max_modules = 20
max_battery_kwh = 30.0
min_tilt_deg = 10.0              # lower tilt bound, degrees
max_tilt_deg = "adjust"          # or a number in degrees
enforce_zeb = false              # true makes the ZEB ratio a hard constraint

# [mode]
# layouts = ["single", "east_west"]  # also search East-West roofs; default ["single"]
# east_west_tilt_deg = 10            # fixed tilt of an East-West design
# fixed_azimuth = 180                # fix the single array's azimuth instead of searching it

[costs]
# Prices from the residential_pt cost preset; replace them with your own quotes.
electricity_cost = 0.2582        # EUR/kWh imported
electricity_sold_cost = 0.04     # EUR/kWh exported
daily_power_cost = 0.30          # EUR/day standing charge
module_cost_per_w = 0.125        # EUR/W of module rating
storage_cost_per_kwh = 500.0     # EUR/kWh of nominal capacity
inverter_cost_per_kw_hybrid = 102.58  # EUR/kW AC, with a battery
inverter_cost_per_kw_simple = 48.37   # EUR/kW AC, PV only
installation_cost_per_module = 350.0  # EUR per module
installation_cost_battery = 350.0     # EUR, once, with a battery
other_cost_per_module = 30.0     # EUR per module, such as cabling
other_costs = 0.0                # EUR, once
maintenance_cost_per_panel = 10.0  # EUR per module per year
maintenance_cost = 0.0           # EUR per year
dc_ac_ratio = 1.25               # DC/AC ratio that sets the inverter AC rating

[financials]
discount_rate = 0.05
inflation_rate = 0.02            # general inflation; the escalators below inherit it
sell_price_inflation = 0.0
# import_price_escalation = 0.03  # import energy and the fixed charge
# om_escalation = 0.02            # O&M
# replacement_cost_learning = 0.0 # annual fall in the replacement price

[emissions]                      # adds Projected_CO2_* to every Pareto row
# The packaged PT emissions factor; `breos list emissions` shows the others.
country = "Portugal"
average_grid_carbon_intensity_gco2_kwh = 127.91
source = "Ember Climate, Europe Yearly Full Release"
year = 2025

[simulation]
resolution = "h"                 # "15min" is four times slower
years_projection = 20
