name: Tests

on:
  # Develop too: its branch protection does not require a pull request to be
  # up to date before it merges, so two PRs that pass alone can still break
  # together. The push run tests the tree each merge lands, without blocking it.
  push:
    branches: [main, develop, "release/**"]
  # Deliberately unfiltered: a `branches` filter here matches the *base* of the
  # pull request, so a PR stacked on another feature branch would get no run at
  # all until it was retargeted at develop, which is the point where a failure
  # is most expensive to discover. Draft PRs run nothing; marking one ready
  # for review starts the run.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Slow tests, platform checks and coverage remain available on demand and
  # run automatically at the release gates.
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels that PR's run still in progress. Other
# events get a group of their own (the run id), so pushes and manual runs
# are never cancelled or queued behind one another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    # Every other job needs this one, so a draft PR, which skips it, runs
    # nothing. `code` is false only for a PR that touches documentation alone;
    # every other event tests everything.
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          # The PR's merge commit and its parents: the first parent is the
          # base branch tip, so the diff is exactly what the PR changes.
          fetch-depth: 2

      - name: Classify the changed files
        id: classify
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only HEAD^1 HEAD)
          printf '%s\n' "$changed"
          # Documentation: docs/, design/, maintainers/, and the top-level
          # Markdown files and CITATION.cff. Anything else counts as code.
          if printf '%s\n' "$changed" | grep -qvE '^(docs/|design/|maintainers/|[^/]+\.md$|CITATION\.cff$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Documentation-only change."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    # The default fast suite runs on pushes and PRs (including release/**),
    # not on the manually dispatched slow runs.
    needs: changes
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    env:
      UV_PYTHON: ${{ matrix.python-version }}
      # Artifact verification gives the same answer on every version, so
      # 3.12 alone checks the installed wheel. Quality and docs run separately.
      PRIMARY: ${{ matrix.python-version == '3.12' }}
      # A documentation-only PR still runs the suite on 3.12, since several
      # tests read docs/ and the README quickstart. The other versions skip
      # their steps rather than the job: the four test (3.x) checks are
      # required, and a job skipped by its `if` never reports them by name.
      RUN_SUITE: ${{ needs.changes.outputs.code == 'true' || matrix.python-version == '3.12' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RUN_SUITE == 'true'

      - name: Install uv
        if: env.RUN_SUITE == 'true'
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Set up Python
        if: env.RUN_SUITE == 'true'
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        if: env.RUN_SUITE == 'true'
        run: uv sync --extra dev

      - name: Run tests
        if: env.RUN_SUITE == 'true'
        # Slow tests are deselected by default (pyproject addopts: -m "not slow").
        # Keep explicitly grouped shared-fixture tests on the same worker;
        # unmarked tests still spread over the runner's cores.
        run: uv run pytest tests/ -v -n auto --dist loadgroup --durations=20

      - name: Verify release artifacts
        if: env.PRIMARY == 'true'
        run: uv run python tools/verify_release_artifacts.py

  quality-docs:
    # A stable check name for branch protection, independent of the version
    # matrix. Run on documentation-only PRs too, alongside the 3.12 suite.
    needs: changes
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    env:
      UV_PYTHON: "3.12"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev --extra docs

      - name: Lint
        run: uv run ruff check breos/ tests/ tools/

      - name: Check formatting
        run: uv run ruff format --check breos/ tests/ tools/

      - name: Type check
        run: uv run mypy breos

      - name: Build docs
        env:
          BREOS_DOCS_OFFLINE: "1"
        run: uv run --extra docs sphinx-build -W -b html docs docs/_build/html

  platform-smoke:
    # Keep non-Linux coverage focused on installation and public entrypoints;
    # the complete version matrix remains on Linux above. macOS minutes are
    # metered at about ten times the Linux rate, so this runs on demand and
    # at the release gates (pushes to main and release/**, PRs into them, and
    # PRs from release/**) rather than on every PR commit or develop merge.
    needs: changes
    if: >-
      (github.event_name == 'push' && github.ref != 'refs/heads/develop') ||
      github.event_name == 'workflow_dispatch' ||
      github.base_ref == 'main' ||
      startsWith(github.base_ref, 'release/') ||
      startsWith(github.head_ref, 'release/')
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    env:
      UV_PYTHON: "3.12"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Smoke-test public entrypoints
        run: >-
          uv run pytest
          tests/test_public_api.py
          tests/test_cli.py::test_run_from_flags_outputs_json tests/test_cli.py::test_run_dry_run_outputs_resolved_config_without_simulating
          tests/test_release_smoke.py::test_readme_quickstart_smoke
          -q

      - name: Check backend bit identity on this platform
        # Bit identity between the Python and Numba backends depends on the
        # platform's libm (see the zeta-pow test), so check it off Linux too.
        run: uv run pytest tests/test_numba_dispatch_parity.py -q

  floors:
    # The declared dependency floors (numpy 2.0, pandas 2.3.3, pvlib 0.14,
    # scipy 1.14) on the oldest supported Python. The lock pins much newer
    # releases, so without this job a floor could break unnoticed (#150 was
    # a pandas-version bug). Documentation-only PRs skip it.
    needs: changes
    if: >-
      (github.event_name == 'push' || github.event_name == 'pull_request') &&
      needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    env:
      UV_PYTHON: "3.11"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Set up Python
        run: uv python install 3.11

      - name: Install the lowest direct dependencies
        # Re-resolves instead of using uv.lock; the rewritten lock is discarded.
        run: uv sync --extra dev --resolution lowest-direct

      - name: Show the resolved floors
        run: uv run --no-sync python -c "import numpy, pandas, pvlib, scipy; print(numpy.__version__, pandas.__version__, pvlib.__version__, scipy.__version__)"

      - name: Run tests
        run: uv run --no-sync pytest tests/ -q -n auto --dist loadgroup --durations=20

  no-numba:
    # Numba is an optional extra, and importing BREOS must not need it. The
    # dev extra installs it, so remove it and run the whole suite: backend
    # tests skip, and everything else runs on the Python path.
    # Documentation-only PRs skip it.
    needs: changes
    if: >-
      (github.event_name == 'push' || github.event_name == 'pull_request') &&
      needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    env:
      UV_PYTHON: "3.12"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies without Numba
        run: |
          uv sync --extra dev
          uv pip uninstall numba llvmlite
          uv run --no-sync python -c "import importlib.util, sys; sys.exit(importlib.util.find_spec('numba') is not None)"

      - name: Run tests
        run: uv run --no-sync pytest tests/ -q -n auto --dist loadgroup --durations=20

  slow-tests:
    # Long-running endurance tests on Python 3.12. Release pushes and PRs run
    # this gate automatically; other branches use manual runs.
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/heads/release/') ||
      startsWith(github.base_ref, 'release/') ||
      startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest

    env:
      UV_PYTHON: "3.12"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run slow tests
        run: uv run pytest tests/ -m slow -v --durations=20

  coverage-report:
    # Publishes a branch-aware core-coverage snapshot; it is a report, not a
    # gate. No threshold is configured, so a failure here means the instrumented
    # run itself broke, never that coverage is too low. Instrumenting the whole
    # suite makes it several times slower, which is why it stays off the
    # per-PR path. If diff coverage matters later, add a check scoped to the
    # changed lines rather than restoring this to the matrix.
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/heads/release/') ||
      startsWith(github.base_ref, 'release/') ||
      startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest

    env:
      UV_PYTHON: "3.12"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests with core coverage
        # Vendored BLAST-Lite is excluded by the coverage configuration.
        # pytest-cov combines the xdist workers' data into one report.
        run: uv run pytest tests/ -v -n auto --dist loadgroup --durations=20 --cov=breos --cov-report=term-missing --cov-report=xml

      - name: Upload core coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-coverage-python-3.12
          path: coverage.xml
          if-no-files-found: error
