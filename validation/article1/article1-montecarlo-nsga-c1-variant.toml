# NSGA-II C1 variant: Monte Carlo sensitivity artifact, NOT a publication
# configuration. The domain-corrected exhaustive enumeration (48,510 designs,
# revision-0.6.1/task4-domain-corrected/exhaustive-1c) gives the true max-NPV
# design as 6 PV / 0 kWh at 30 deg / 200 deg (NPV 5451.83 EUR, GI 40.705 %),
# which is what publication case C1 uses. NSGA-II instead returned
# 35 deg / 195 deg (NPV 5439.47 EUR, GI 40.529 %), a dominated point. This
# config replays that NSGA-II answer so the two can be compared under the
# same seed and trajectory count.
#
# Derived from validation/article1/article1-montecarlo.toml
# sha256 2e22d026cd69b95d125c18d75b09da482fd039a6006f2f53f0955103b8d603c9
# Every physical, economic and Monte Carlo setting below is unchanged from
# that file; only the case block differs.

# Historical-weather Monte Carlo source-data configuration for the forthcoming
# publication.
#
# The licensed E-REDES RLP and the historical weather CSV are external inputs.
# Pass both paths to tools/reproduce_article1_montecarlo.py; do not add them to
# this file or commit them.

annual_consumption_kwh = 5000.0
pv_module = "Suntech_STP550S_STC"
pv_module_width_m = 1.134
pv_module_length_m = 2.278
load_profile = "6"
resolution = "15min"
projection_years = 20
start_date = "2025-01-01"
pv_degradation_rate = 0.005
calendar_model = "naumann_lam_field_calibrated"
battery_min_soc = 0.10
battery_max_soc = 0.90
battery_eol_percentage = 0.70
battery_rte = 0.95
# Symmetric 1 C limit, matching the optimization config and the BYD HVS
# family rating. Replaces the absolute 4352 W cap, which did not scale with
# pack size.
battery_power_limit_c_rate = 1.0
# Weather ambient buffered by the indoor model; see the optimization config.
battery_temperature = "weather"
battery_indoor_model = { enabled = true }
inverter_efficiency = 0.96
# The pinned Open-Meteo weather snapshot uses preceding-hour radiation means
# labelled at the interval end. Weather loading moves each label back one hour;
# the metadata-driven solar position then evaluates each 15-minute interval at
# its centre. Hourly irradiance energy is preserved during disaggregation. Use
# Perez transposition and Marion diffuse/ground IAM instead of beam-only IAM;
# the beam-only default is a documented 0.5-1.5% systematic overestimate.
transposition_model = "perez"
model_perez = "allsitescomposite1990"
solar_position = "weather"
iam_model = "ashrae"
diffuse_iam = "marion"
albedo = 0.25
temperature_model = "faiman"
bifacial_model = "none"
inverter_loading_ratio = 1.25
inflation_rate = 0.02
sell_price_inflation = 0.0
discount_rate = 0.05
emissions_country = "PT"

[location]
latitude = 41.1579
longitude = -8.6291
timezone = "Europe/Lisbon"
name = "Porto, Portugal"

[costs]
electricity_cost = 0.2582
electricity_sold_cost = 0.04
daily_power_cost = 0.30
module_cost_per_w = 0.125
storage_cost_per_kwh = 500.0
inverter_cost_per_kw_hybrid = 102.58
inverter_cost_per_kw_simple = 48.37
installation_cost_per_module = 350.0
installation_cost_battery = 350.0
other_cost_per_module = 30.0
other_costs = 0.0
maintenance_cost_per_panel = 10.0
maintenance_cost = 0.0

[montecarlo]
n_runs = 10000
years_per_run = 20
load_distribution = "uniform"
load_uncertainty = 0.05
target_year = 2025
weather_start_year = 2005
weather_end_year = 2023
seed = 42
min_load_scale = 0.95
max_load_scale = 1.05
preserve_irradiance_energy = true
collect_yearly = true
n_procs = 1

[cases.C1_NSGA]
# The NSGA-II max-NPV answer. Dominated by C1 on both objectives.
label = "Maximum NPV (NSGA-II answer)"
n_modules = 6
battery_kwh = 0.0
tilt = 35.0
azimuth = 195.0
