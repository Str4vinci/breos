# Recommended rooftop PV-model profile for a new hourly study.
#
# This example opts into BREOS's higher-fidelity PV-model choices explicitly.
# They are recommendations, not defaults: a config that does not set these
# keys keeps the default models, so earlier results stay reproducible.
#
#   breos validate-config configs/examples/recommended-pv.toml
#   breos run --config configs/examples/recommended-pv.toml

location = "porto"
tilt = 35
azimuth = 180
n_modules = 8
annual_consumption_kwh = 4000
battery_kwh = 0

# The Suntech catalog entry has sourced module efficiency, which the selected
# PVsyst heat-balance model consumes. The semi-integrated preset represents a
# close rooftop mount with a rear air gap; choose a mount-appropriate thermal
# preset for a different installation.
#
# solar_position = "weather" reads the timing of each irradiance value from
# the weather metadata: the PVGIS fetch and the weather CSVs BREOS writes
# (with their .metadata.json sidecar) carry it. A CSV without that metadata is
# refused; set "interval-start" or "mid-interval" to match its timestamps.
pv_module = "Suntech_STP550S_STC"
transposition_model = "perez"
solar_position = "weather"
iam_model = "physical"
diffuse_iam = "marion"
temperature_model = "pvsyst-semi-integrated"
albedo = 0.2

load_profile = "demandlib_h0"
cost_preset = "residential_pt"
emissions_country = "PT"
projection_years = 20
resolution = "h"
