# Template for using non-bundled load profiles.
# Put licensed CSV files in this directory; do not commit third-party RLPs
# unless their license explicitly allows redistribution.
rlp_directory = "external_rlp"

location = "porto"
n_modules = 10
annual_consumption_kwh = 4000
battery_kwh = 5.0

# E-REDES BTN C. Requires one EREDES_<year>_BTN_1000kwh_15min.csv and/or one
# EREDES_<year>_BTN_1000kwh_hourly.csv inside rlp_directory. If several years
# are there, name the one to use with load_profile_file.
# tools/convert_eredes_profiles.py makes both files from the E-REDES publication.
load_profile = "eredes_btn_c"
resolution = "15min"

cost_preset = "residential_pt"
emissions_country = "PT"
