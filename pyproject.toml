[project]
name = "breos"
version = "0.7.0"
description = "Python library for PV and battery energy-system simulation and optimization"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.11"
authors = [
    {name = "Leonardo Rodrigues", email = "lrodrigues@fe.up.pt"},
]
keywords = [
    "photovoltaic",
    "battery",
    "energy",
    "simulation",
    "optimization",
    "solar",
    "degradation",
    "renewable-energy",
    "energy-storage",
    "self-consumption",
    "pvlib",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.3.3",
    "pvlib>=0.14.0,<0.16",
    "rainflow>=3.2.0",
    "scipy>=1.14",
    "threadpoolctl>=3.5.0",
]

[project.urls]
Homepage = "https://github.com/Str4vinci/breos"
Documentation = "https://breos.readthedocs.io/"
Repository = "https://github.com/Str4vinci/breos"
Issues = "https://github.com/Str4vinci/breos/issues"
Changelog = "https://github.com/Str4vinci/breos/blob/main/CHANGELOG.md"

[project.scripts]
breos = "breos.cli:main"

[project.optional-dependencies]
fast = ["numba>=0.63.1"]
plots = ["matplotlib>=3.10.8"]
optimization = ["pymoo>=0.6.1.6"]
weather = [
    "openmeteo-requests>=1.7.4",
    "requests-cache>=1.2.1",
    "timezonefinder>=8.2.1",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.0",
    "pytest-xdist>=3.8",
    "ruff>=0.15",
    "mypy>=1.18",
    "pandas-stubs>=2.3",
    "matplotlib>=3.10.8",
    "numba>=0.63.1",
    "openmeteo-requests>=1.7.4",
    "pymoo>=0.6.1.6",
    "requests-cache>=1.2.1",
    "timezonefinder>=8.2.1",
]
docs = [
    "sphinx>=8.1",
    "pydata-sphinx-theme>=0.16",
    "myst-parser>=4.0",
    "sphinx-design>=0.6",
    "sphinx-copybutton>=0.5",
    "sphinx-autodoc-typehints>=2.5",
    "matplotlib>=3.10.8",
    "sphinx-gallery>=0.19",
    "sphinxext-opengraph>=0.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Slow endurance/multi-year tests are deselected by default so the normal suite
# stays fast. Run them explicitly with `pytest -m slow` (the scheduled CI job
# and the release verification both do this); `-m slow` on the command line
# overrides this default marker expression.
addopts = ["-m", "not slow"]
markers = [
    "slow: long-running endurance and multi-year integration tests; deselected by default, run with -m slow",
]

[tool.coverage.run]
branch = true
source = ["breos"]
omit = ["breos/degradation/blast/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B904", "B905"]
ignore = [
    "E501",   # line too long — handled by formatter
    "E741",   # ambiguous variable name — common in scientific code (l, I, O)
]

[tool.ruff.lint.per-file-ignores]
"breos/__init__.py" = ["F811"]          # shadowed imports
"breos/degradation/blast/models/__init__.py" = ["F401"]  # vendored package re-export; source hash must stay intact
"tests/*" = ["F811", "B905"]              # pytest fixtures; zip lengths are often intentionally dynamic
"tools/*" = ["E402", "B905"]               # CLI scripts; keep B905 focused on core modules
"breos/degradation/blast/**/*.py" = ["E401", "F841", "I001", "W291", "W292", "W293", "B905"]  # vendored BLAST-Lite source

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# Keep the source distribution independent of files that happen to be present
# in a maintainer's checkout. Add a path here only when it belongs in the
# published source archive.
include = [
    "/ATTRIBUTIONS.md",
    "/CHANGELOG.md",
    "/CITATION.cff",
    "/CODE_OF_CONDUCT.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
    "/README.md",
    "/ROADMAP.md",
    "/SECURITY.md",
    "/breos",
    "/configs",
    "/docs",
    "/maintainers",
    "/pyproject.toml",
    "/tests",
    "/tools",
    "/uv.lock",
    "/validation",
]

[tool.mypy]
# Baseline type checking for the published package. It runs with the `dev`
# extra installed and pandas-stubs; untyped function bodies are not checked
# yet (check_untyped_defs is off), so this catches errors in annotated code.
python_version = "3.11"
files = ["breos"]
exclude = ['^breos/degradation/blast/']  # vendored BLAST-Lite source
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

# Third-party libraries that ship neither inline types nor a py.typed marker.
[[tool.mypy.overrides]]
module = [
    "llvmlite.*",
    "mpl_toolkits.*",
    "pvlib.*",
    "pymoo.*",
    "rainflow.*",
    "requests.*",
    "scipy.*",
    "threadpoolctl.*",
]
ignore_missing_imports = true

# Vendored BLAST-Lite source: excluded from discovery above, but still reached
# through breos.degradation.engine, so its errors are silenced here too.
[[tool.mypy.overrides]]
module = ["breos.degradation.blast.*"]
ignore_errors = true

# Modules not yet clean. Each is a follow-up; remove it from this list once
# `uv run mypy breos` passes without it. battery.py's errors come mostly from
# its dynamically attached buffer attributes (#178).
[[tool.mypy.overrides]]
module = [
    "breos.battery",
    "breos.load_profiles",
    "breos.montecarlo",
    "breos.optimization",
    "breos.plotting",
    "breos.weather",
]
ignore_errors = true
